apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-schedule
  namespace: event-schedule
  labels:
    app: event-schedule
spec:
  replicas: 2
  selector:
    matchLabels:
      app: event-schedule
  template:
    metadata:
      labels:
        app: event-schedule
    spec:
      containers:
        - name: event-schedule
          image: event-schedule:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: event-schedule-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: event-schedule-service
  namespace: event-schedule
spec:
  type: NodePort
  selector:
    app: event-schedule
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: event-schedule-ingress
  namespace: event-schedule
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: event-schedule-service
                port:
                  number: 80
